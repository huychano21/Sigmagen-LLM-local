[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmagen"
version = "0.1.0"
description = "AI-powered Sigma rule generator using MITRE ATT&CK and RAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SigmaGen Contributors"},
]
keywords = ["sigma", "detection", "mitre", "att&ck", "security", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click==8.1.7",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "rich==13.7.1",
    "chromadb==0.5.3",
    "sentence-transformers==3.1.1",
    "anthropic==0.34.0",
    "openai==1.40.0",
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.3",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "httpx==0.27.0",
]

[project.scripts]
sigmagen = "sigmagen.cli.commands:cli"

[project.urls]
Homepage = "https://github.com/sigmagen-project/sigmagen"
Issues = "https://github.com/sigmagen-project/sigmagen/issues"

[tool.setuptools.packages.find]
include = ["sigmagen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
