title: Suspicious TrustedInstaller.exe spawning by services.exe
id: 72c20dea-547c-4e71-bb02-60237c676e10
status: experimental
description: Detects the spawning of TrustedInstaller.exe by services.exe, which may
  indicate suspicious activity.
references: https://attack.mitre.org/techniques/T1059
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \trustedinstaller.exe
    ParentImage|endswith: \services.exe
  condition: selection
falsepositives: Legitimate administrative script execution
level: medium
