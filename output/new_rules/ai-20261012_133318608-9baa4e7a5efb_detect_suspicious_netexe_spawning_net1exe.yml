title: Detect suspicious net.exe spawning net1.exe
id: 08b0c4e0-2d0a-11ed-861d-0242ac130003
status: experimental
description: Detects the spawning of net1.exe by net.exe, which may indicate a lateral
  movement or privilege escalation activity.
references: https://attack.mitre.org/techniques/T1087/
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1087
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \net1.exe
    ParentImage|endswith: \net.exe
  condition: selection
falsepositives:
- Legitimate administrative script execution
level: medium
