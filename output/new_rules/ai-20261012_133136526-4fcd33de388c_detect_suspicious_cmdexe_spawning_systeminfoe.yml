title: Detect Suspicious cmd.exe spawning systeminfo.exe
id: 6de3070f-45fa-4358-986c-c2287992ceaa
status: experimental
description: Detects a suspicious execution of systeminfo.exe spawned by cmd.exe,
  which may indicate a lateral movement or information gathering activity.
references:
- https://attack.mitre.org/techniques/T1087/
- https://attack.mitre.org/techniques/T1059/003/
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1087
- attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \systeminfo.exe
    ParentImage|endswith: \cmd.exe
  condition: selection
falsepositives:
- Legitimate administrative script execution
level: medium
