title: User Account Privilege Enumeration via Command Shell
id: c97e1d9a-912b-4d51-82eb-567954a5ff60
status: experimental
description: 'Suspicious powershell.exe Spawning cmd.exe (Windows command prompt started
  by an abnormal process) - Host WIN-5J23U7CAV7V.hvan.vn triggered sequence anomaly
  (token=''sysmon|1|process_create|powershell.exe>cmd.exe|system32|tiny_few'', score=0.9975):
  Image=cmd.exe, ParentImage=powers'
references:
- https://attack.mitre.org/techniques/T1059/003/
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \cmd.exe
    ParentImage|endswith: \powershell.exe
    CommandLine|contains: whoami
  condition: selection
falsepositives:
- Legitimate administrative activity
level: medium
