title: Detect suspicious cmd.exe spawning nbtstat.exe
id: 08b23e4b-5f4c-4e2d-9f8a-7e9c5d7f8e4b
status: experimental
description: Detects the spawning of nbtstat.exe by cmd.exe, which may indicate suspicious
  Windows cmd shell execution.
references: https://attack.mitre.org/techniques/T1087/
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1087
- attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \nbtstat.exe
    ParentImage|endswith: \cmd.exe
  condition: selection
falsepositives:
- Legitimate administrative script execution
level: medium
