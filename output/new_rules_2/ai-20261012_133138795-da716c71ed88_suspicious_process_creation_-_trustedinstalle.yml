title: Suspicious Process Creation - TrustedInstaller.exe Spawned by services.exe
id: a468590e-42e5-43fd-8963-0068e3873e33
status: experimental
description: Detects the creation of the TrustedInstaller.exe process spawned by services.exe,
  which is a potential indicator of lateral movement or privilege escalation.
references: https://attack.mitre.org/techniques/T1082/
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1082
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \trustedinstaller.exe
    ParentImage|endswith: \services.exe
  condition: selection
falsepositives:
- Legitimate administrative actions
level: medium
