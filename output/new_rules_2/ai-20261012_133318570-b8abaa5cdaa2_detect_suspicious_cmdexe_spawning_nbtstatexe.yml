title: Detect Suspicious cmd.exe Spawning nbtstat.exe
id: b90e607c-c665-4968-8568-559184c77e67
status: experimental
description: Detects suspicious execution of nbtstat.exe spawned by cmd.exe, which
  is a common technique for reconnaissance and network scanning.
references: https://attack.mitre.org/techniques/T1087/
author: SigmaGen
date: '2026-10-27'
tags:
- attack.t1087
- attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \nbtstat.exe
    ParentImage|endswith: \cmd.exe
    CommandLine|contains: nbtstat  -n
  condition: selection
falsepositives:
- Legitimate administrative script execution
level: medium
