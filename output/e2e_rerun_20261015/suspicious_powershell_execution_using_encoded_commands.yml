title: Suspicious PowerShell Execution Using Encoded Commands
id: 00000000-0000-0000-0000-000000000001
status: experimental
description: Detects suspicious PowerShell execution using encoded commands, which
  is a technique to evade detection.
references:
- https://attack.mitre.org/techniques/T1059/001
author: SigmaGen
date: '2026-10-15'
tags:
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - powershell
    - -enc
  condition: selection
falsepositives:
- Legitimate admin usage
level: high
