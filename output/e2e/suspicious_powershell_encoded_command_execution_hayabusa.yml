title: Suspicious PowerShell Encoded Command Execution
id: 00000000-0000-4000-8000-000000000468
status: experimental
description: Detects PowerShell process creation with encoded-command indicators in Windows Security event 4688.
author: SigmaGen
date: '2026-10-13'
logsource:
    product: windows
    service: security
    description: Process creation auditing with command-line logging enabled.
detection:
    selection:
        Channel: Security
        EventID: 4688
        CommandLine|contains|all:
            - powershell
            - -enc
    condition: selection
falsepositives:
    - Legitimate administrative use of encoded PowerShell commands
level: high
tags:
    - attack.t1059.001
ruletype: Hayabusa
