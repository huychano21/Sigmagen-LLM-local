title: Suspicious PowerShell Encoded Command Execution
id: 7f5b0e2a-61c4-4a8e-b932-5d1c9e7a4068
status: experimental
description: Detects encoded PowerShell command indicators in Windows Security process creation events.
author: SigmaGen
date: '2026-10-14'
logsource:
    product: windows
    category: process_creation
detection:
    process_creation:
        Channel: Security
        EventID: 4688
    selection:
        ProcessCommandLine|contains|all:
            - powershell
            - -enc
    condition: process_creation and selection
falsepositives:
    - Legitimate administrative use of encoded PowerShell commands
level: high
tags:
    - attack.t1059.001
ruletype: Hayabusa